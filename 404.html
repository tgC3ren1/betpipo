<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Sayfa Bulunamadı | Betpipo Güncel Giriş</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 25px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top,
        rgba(32,163,74,.15), transparent 35%),
        #07131a;
      color: #f5f7f8;
      text-align: center;
    }

    .box {
      width: min(560px, 100%);
      padding: 45px 30px;
      background: #0c2029;
      border: 1px solid rgba(57,209,109,.2);
      border-radius: 22px;
    }

    img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid #20a34a;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 64px;
      margin: 0;
      color: #39d16d;
    }

    h2 {
      margin: 5px 0 10px;
    }

    p {
      color: #a7b4b9;
    }

    a {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 25px;
      border-radius: 12px;
      background: linear-gradient(135deg, #39d16d, #137c36);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
    }
  </style>
</head>

<body>

  <div class="box">

    <img
      src="https://resmim.net/cdn/2026/09/16/EPJYIQ.jpg"
      alt="Betpipo">

    <h1>404</h1>

    <h2>Sayfa Bulunamadı</h2>

    <p>
      Aradığınız sayfa mevcut değil veya adresi değiştirilmiş olabilir.
    </p>

    <a href="https://KULLANICI-ADI.github.io/betpipo/">
      Betpipo Güncel Giriş Sayfasına Dön
    </a>

  </div>

</body>
</html>
